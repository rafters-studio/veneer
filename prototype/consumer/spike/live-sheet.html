<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>veneer spike: live shared-sheet restyle (no iframe, no recompile)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 900px; }
  h1 { font-size: 1.1rem; }
  h2 { font-size: .95rem; margin-block-end: .4rem; }
  section.demo { margin-block: 1.5rem; }

  /* Inherited-property attack: these DO cross the shadow boundary
     (selectors do not, inheritance does). The :host all:initial guard
     is the only thing standing between this and the preview. */
  .hostile-inherited {
    font-size: 90px;
    color: rgb(255, 0, 0);
    --foreground: rgb(255, 0, 0);
    letter-spacing: 12px;
  }

  #report { font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap;
            background: #f4f4f4; padding: .75rem; border-radius: 6px; }
</style>
</head>
<body>
<h1>Spike: one shared constructable sheet, two shadow roots, live replaceSync</h1>

<section class="demo">
  <h2>Instance A (clean ancestor)</h2>
  <veneer-search-box id="a"></veneer-search-box>
</section>

<section class="demo">
  <h2>Instance B (hostile INHERITED props on the ancestor)</h2>
  <div class="hostile-inherited">
    <veneer-search-box id="b"></veneer-search-box>
  </div>
</section>

<section class="demo">
  <h2>Assertions</h2>
  <div id="report">running...</div>
</section>

<script type="module">
const report = document.getElementById('report');
const results = [];
const record = (name, ok, detail) => {
  results.push({ name, ok, detail });
  report.textContent = results.map(r => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}\n      ${r.detail}`).join('\n');
};

// The sheet under test is the REAL rafters standalone sheet, not a fixture:
//   .rafters/output/rafters.standalone.css  (rafters CLI compiled output)
//     -> tools/compile.ts prepends the :host guard and rewrites :root -> :root,:host
//     -> preview-dist/sheet.css
const RAFTERS_STANDALONE = await (await fetch('../.rafters/output/rafters.standalone.css')).text();
const BASE = await (await fetch('../preview-dist/sheet.css')).text();
const hostileEl = document.querySelector('.hostile-inherited');
const mod = await import('../preview-dist/search-box.mjs');
await mod.define(BASE);

const a = document.getElementById('a');
const b = document.getElementById('b');
await customElements.whenDefined('veneer-search-box');

const rootA = a.shadowRoot;
const rootB = b.shadowRoot;
const surfaceA = () => rootA.querySelector('[data-veneer-surface]');
const surfaceB = () => rootB.querySelector('[data-veneer-surface]');

// --- 0. PROVENANCE: the sheet under test IS the rafters standalone sheet ----
// Guard against the spike quietly proving something about a fixture.
const guardOnly = BASE.slice(0, BASE.length - RAFTERS_STANDALONE.length);
const bodyMatches = BASE.endsWith(RAFTERS_STANDALONE.replace(/:root(?!,:host)/g, ':root,:host'));
record(
  '0. the sheet under test is the real rafters compiled output',
  bodyMatches && guardOnly.startsWith(':host{all:initial'),
  `rafters.standalone.css=${RAFTERS_STANDALONE.length}B -> adopted sheet=${BASE.length}B; ` +
  `delta is the :host guard (${guardOnly.length}B) + the :root->:root,:host rewrite; body matches -> ${bodyMatches}`,
);

// --- 1. SHEET IDENTITY: both roots hold the SAME CSSStyleSheet object -------
const sheetA = rootA.adoptedStyleSheets[0];
const sheetB = rootB.adoptedStyleSheets[0];
const sameObject = sheetA === sheetB;
record(
  '1. two shadow roots adopt the SAME CSSStyleSheet instance',
  sameObject && sheetA instanceof CSSStyleSheet,
  `rootA.adoptedStyleSheets.length=${rootA.adoptedStyleSheets.length}, ` +
  `identity sheetA===sheetB -> ${sameObject}`,
);

// Also check a nested child root (veneer-button lives in its own shadow root)
const innerBtn = rootA.querySelector('[block-id="submit-button"]');
const innerSheet = innerBtn?.shadowRoot?.adoptedStyleSheets[0];
record(
  '1b. nested child shadow root adopts the same instance too',
  innerSheet === sheetA,
  `veneer-button root sheet === composite root sheet -> ${innerSheet === sheetA}`,
);

// --- 2. ISOLATION, mechanism by mechanism ----------------------------------
// THREE different mechanisms, not one. Do not collapse them.
const beforeA = getComputedStyle(surfaceA());
const beforeB = getComputedStyle(surfaceB());
const fsA = beforeA.fontSize, fsB = beforeB.fontSize;
const lsB = beforeB.letterSpacing;

// (a) REGULAR inherited props: genuinely reset by :host{all:initial}.
record(
  '2a. regular inherited props are blocked by :host{all:initial}',
  fsA === fsB && fsB === '16px' && lsB === 'normal',
  `A font-size=${fsA}  B font-size=${fsB} (ancestor set 90px), B letter-spacing=${lsB} (ancestor set 12px)`,
);

// (b) color: NOT covered by all:initial in the way you'd assume -- the guard
//     sets color:var(--foreground) explicitly. Different mechanism.
record(
  '2b. color is held by the guard`s explicit color:var(--foreground), not by all:initial',
  beforeB.color !== 'rgb(255, 0, 0)',
  `B color=${beforeB.color} (ancestor set rgb(255,0,0)); --foreground resolves to ${beforeB.getPropertyValue('--foreground').trim()}`,
);

// (c) CUSTOM PROPERTIES are a documented EXCEPTION to the `all` shorthand --
//     all:initial does NOT reset them. Tokens survive only because the
//     :root -> :root,:host rewrite redefines them ON the host, and a value
//     set directly on an element beats an inherited one.
//     Corollary: a custom prop the sheet does NOT define leaks straight in.
//     That is the true boundary of the isolation guarantee -- prove it.
hostileEl.style.setProperty('--veneer-undefined-token', 'rgb(255, 0, 255)');
sheetA.replaceSync(BASE + `
[data-veneer-surface]{border-left:4px solid var(--veneer-undefined-token, rgb(1,2,3))}
`);
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const probeB = getComputedStyle(surfaceB());
const definedTokenHeld = probeB.getPropertyValue('--foreground').trim() !== 'rgb(255, 0, 0)';
const undefinedTokenLeaked = probeB.borderLeftColor === 'rgb(255, 0, 255)';
record(
  '2c. custom props: sheet-DEFINED tokens are shadowed on :host; UNDEFINED ones LEAK',
  definedTokenHeld && undefinedTokenLeaked,
  `--foreground (defined by sheet) held as ${probeB.getPropertyValue('--foreground').trim()}; ` +
  `--veneer-undefined-token (not in sheet) leaked in as ${probeB.borderLeftColor} -- ` +
  `isolation covers the token set the sheet defines, NOT arbitrary custom props`,
);
sheetA.replaceSync(BASE);
hostileEl.style.removeProperty('--veneer-undefined-token');
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

// --- 3. LIVE RESTYLE: ONE replaceSync on the shared object updates BOTH -----
const bgBeforeA = beforeA.backgroundColor;
const bgBeforeB = beforeB.backgroundColor;

const EDIT = BASE + `
[data-veneer-surface]{background-color:rgb(0,128,0)}
[data-veneer-surface]{container-type:inline-size;container-name:spike}
@container spike (min-width:1px){[block-id="submit-button"]{outline:3px dashed rgb(255,0,255)}}
`;

// The whole point: no re-define, no re-mount, no recompile, no iframe reload.
sheetA.replaceSync(EDIT);

await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

const afterA = getComputedStyle(surfaceA());
const afterB = getComputedStyle(surfaceB());
const bgAfterA = afterA.backgroundColor;
const bgAfterB = afterB.backgroundColor;
const bothChanged = bgAfterA === 'rgb(0, 128, 0)' && bgAfterB === 'rgb(0, 128, 0)';
record(
  '3. ONE replaceSync on the shared sheet restyles BOTH roots (no remount)',
  bothChanged,
  `A: ${bgBeforeA} -> ${bgAfterA}   B: ${bgBeforeB} -> ${bgAfterB}`,
);

// --- 4. CONTAINER QUERIES resolve inside the shadow root -------------------
const btnA = rootA.querySelector('[block-id="submit-button"]');
const btnB = rootB.querySelector('[block-id="submit-button"]');
const outA = getComputedStyle(btnA).outlineStyle;
const outB = getComputedStyle(btnB).outlineStyle;
record(
  '4. @container context resolves inside the shadow root',
  outA === 'dashed' && outB === 'dashed',
  `container-driven outline-style  A=${outA}  B=${outB} (expected dashed)`,
);

// --- 5. REVERT: replaceSync back, both roots return to baseline ------------
sheetA.replaceSync(BASE);
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const revertA = getComputedStyle(surfaceA()).backgroundColor;
const revertB = getComputedStyle(surfaceB()).backgroundColor;
record(
  '5. replaceSync back to baseline reverts both roots (edit loop is bidirectional)',
  revertA === bgBeforeA && revertB === bgBeforeB,
  `A: ${bgAfterA} -> ${revertA}   B: ${bgAfterB} -> ${revertB}`,
);

const allPass = results.every(r => r.ok);
report.textContent += `\n\n${allPass ? 'ALL PASS' : 'FAILURES PRESENT'} (${results.filter(r=>r.ok).length}/${results.length})`;
window.__SPIKE__ = { allPass, results };
</script>
</body>
</html>
