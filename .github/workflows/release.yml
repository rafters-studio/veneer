name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @rafters/veneer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Set the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "packages/veneer/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.TAG.replace(/^v/, "");
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
      - run: pnpm --filter @rafters/veneer exec vp pack
      - run: pnpm --filter @rafters/veneer publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
