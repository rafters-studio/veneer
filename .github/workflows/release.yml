name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @rafters/veneer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Set the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "packages/veneer/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.TAG.replace(/^v/, "");
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
      - run: pnpm -r build
      - run: cargo build -p veneer-lsp
      - run: pnpm bdd
      - run: pnpm --filter @rafters/veneer publish --access public --no-git-checks
