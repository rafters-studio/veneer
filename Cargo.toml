[workspace]
resolver = "2"
members = [
    "crates/veneer-check",
    "crates/veneer-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rafters-studio/veneer"
authors = ["Sean Silvius"]

[workspace.dependencies]
# Crate dependencies
veneer-check = { path = "crates/veneer-check" }

[profile.release]
strip = true
lto = true
codegen-units = 1
