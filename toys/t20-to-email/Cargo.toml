[package]
name = "t20-to-email"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["substitute_variables"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
